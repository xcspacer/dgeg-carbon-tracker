# DGEG Carbon Tracker - Docker Compose
# Orquestra backend e frontend com um único comando

version: '3.8'

services:
  # Backend - FastAPI Python
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dgeg-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount para desenvolvimento (hot reload)
      - ./backend/app:/app/app:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - dgeg-network

  # Frontend - React + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dgeg-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - dgeg-network

networks:
  dgeg-network:
    driver: bridge
    name: dgeg-carbon-tracker-network
